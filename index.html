          transition: width 180ms ease-out;
        "

      "
    >
      0% Complete
    </div>
    <div
      id="hdb-hydrate-progress-message"
      style="
        margin-top: 8px;
        text-align: center;
        color: rgba(0, 0, 0, 0.6);
        font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 12px;
      "
    >
      Preparing client bootstrap...
    </div>
  </div>
</div>
<script type="text/javascript">
  (function () {
    var MAX_PROGRESS = 33;
    var progress = 0;
    var message = 'Preparing client bootstrap...';
    var bar = document.getElementById('hdb-hydrate-progress-bar');
    var valueNode = document.getElementById('hdb-hydrate-progress-value');
    var messageNode = document.getElementById('hdb-hydrate-progress-message');

    if (!bar || !valueNode || !messageNode) {
      return;
    }

    var clamp = function (value) {
      var normalized = Number.isFinite(value) ? Math.round(value) : 0;
      return Math.max(0, Math.min(MAX_PROGRESS, normalized));
    };

    var render = function () {
      bar.style.width = String(progress) + '%';
      valueNode.textContent = String(progress) + '% Complete';
      messageNode.textContent = message;
    };

    var setProgress = function (nextProgress, nextMessage) {
      progress = clamp(nextProgress);
      if (typeof nextMessage === 'string' && nextMessage.trim().length > 0) {
        message = nextMessage;
      }
      render();
    };

    window.__HDB_HYDRATE_LOADER__ = {
      setProgress: setProgress,
      maxProgress: MAX_PROGRESS
    };

    render();
  })();
</script>
