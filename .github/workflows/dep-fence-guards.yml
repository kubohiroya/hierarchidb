name: dep-fence Guards

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "plans/**"
      - "reports/**"
      - "LICENSE"
      - ".kiro/**"
  push:
    branches:
      - chore/folder-plugin/unused-sweep-v1
  workflow_dispatch: {}

concurrency:
  group: dep-fence-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Run dep-fence guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci:checks

      - name: Run build stage
        run: pnpm run build

      - name: Run guards (pre-commit equivalent)
        run: pnpm run guards:pre-commit
