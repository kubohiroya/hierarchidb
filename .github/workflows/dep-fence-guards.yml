name: dep-fence Guards

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - chore/folder-plugin/unused-sweep-v1
  workflow_dispatch: {}

jobs:
  guards:
    name: Run dep-fence guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          package_json_path: ./package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Run stage
        run: pnpm run build

      - name: Run guards (pre-commit equivalent)
        run: pnpm run guards:pre-commit
