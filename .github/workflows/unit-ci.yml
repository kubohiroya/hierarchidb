name: Unit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: unit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codemod-check:
    name: Codemod Dry-Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --force

      - name: Codemod dry-run (styler plugin)
        run: pnpm codemod:run --codemod migrate-plugin-worker --dry-run --plugin styler

  typecheck-all:
    name: Typecheck All (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Prune PNPM store (avoid stale cache)
        run: pnpm store prune || true

      - name: Install dependencies (force re-resolve)
        run: pnpm install --no-frozen-lockfile --force

      - name: Ensure backend node_modules
        run: |
          pnpm --filter @hierarchidb/bff install --no-frozen-lockfile --force
          pnpm --filter @hierarchidb/cors-proxy install --no-frozen-lockfile --force

      - name: Show HEAD and tool versions
        run: |
          git rev-parse HEAD
          node -v
          pnpm -v
          npx tsc -v || true

      - name: Remove stale build artifacts
        run: |
          find . -name "dist" -type d -prune -exec rm -rf {} + || true
          find . -name "*.tsbuildinfo" -type f -delete || true

      - name: Typecheck (entire workspace)
        run: pnpm -r --workspace-concurrency 1 typecheck
  build-all:
    name: Build All (workspace)
    runs-on: ubuntu-latest
    needs: [typecheck-all]
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Prune PNPM store (avoid stale cache)
        run: pnpm store prune || true

      - name: Install dependencies (force re-resolve)
        run: pnpm install --no-frozen-lockfile --force

      - name: Build (entire workspace)
        run: pnpm -r --workspace-concurrency 1 build

  tests:
    name: Test ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pkg:
          - { name: basemap-plugin, filter: "@hierarchidb/plugins-basemap-plugin" }
          - { name: folder-plugin,  filter: "@hierarchidb/plugins-folder-plugin" }
          - { name: resolver-plugin, filter: "@hierarchidb/plugins-resolver-plugin" }
          - { name: styler-plugin,   filter: "@hierarchidb/plugins-styler-plugin" }
          - { name: shape-plugin (unit only), filter: "@hierarchidb/plugins-shape-plugin" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --force

      - name: Run unit/integration tests
        env:
          # Ensure deep/integration tests stay gated unless explicitly enabled
          ENABLE_SHAPE_DEEP_TESTS: ""
          ENABLE_INTEGRATION_TESTS: ""
          CI: "true"
          VITEST_POOL: "threads"
          VITEST_MAX_THREADS: "2"
          VITEST_MIN_THREADS: "1"
        run: pnpm --filter "${{ matrix.pkg.filter }}" test

  coverage:
    name: Coverage ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pkg:
          - { name: basemap-plugin, filter: "@hierarchidb/plugins-basemap-plugin" }
          - { name: folder-plugin,  filter: "@hierarchidb/plugins-folder-plugin" }
          - { name: resolver-plugin, filter: "@hierarchidb/plugins-resolver-plugin" }
          - { name: styler-plugin,   filter: "@hierarchidb/plugins-styler-plugin" }
          - { name: shape-plugin (unit only), filter: "@hierarchidb/plugins-shape-plugin" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --force

      - name: Run coverage
        env:
          CI: "true"
        run: pnpm --filter "${{ matrix.pkg.filter }}" coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.pkg.name }}
          path: |
            packages/**/${{ matrix.pkg.name }}/coverage/**
            **/${{ matrix.pkg.name }}/coverage/**
          if-no-files-found: warn

  build:
    name: Typecheck/Build ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pkg:
          - { name: basemap-plugin, filter: "@hierarchidb/plugins-basemap-plugin" }
          - { name: folder-plugin,  filter: "@hierarchidb/plugins-folder-plugin" }
          - { name: resolver-plugin, filter: "@hierarchidb/plugins-resolver-plugin" }
          - { name: styler-plugin,   filter: "@hierarchidb/plugins-styler-plugin" }
          - { name: shape-plugin (unit only), filter: "@hierarchidb/plugins-shape-plugin" }
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --force

      - name: Run coverage
        env:
          CI: "true"
        run: pnpm --filter "${{ matrix.pkg.filter }}" coverage

      - name: Typecheck (with deps)
        run: pnpm -r --filter "${{ matrix.pkg.filter }}^..." typecheck

      - name: Build (with deps)
        run: pnpm -r --filter "${{ matrix.pkg.filter }}^..." build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.pkg.name }}
          path: |
            packages/**/${{ matrix.pkg.name }}/coverage/**
            **/${{ matrix.pkg.name }}/coverage/**
          if-no-files-found: warn
