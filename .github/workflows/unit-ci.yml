name: Unit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: unit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-all:
    name: Typecheck All (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck (entire workspace)
        run: pnpm -r --workspace-concurrency 1 typecheck
  build-all:
    name: Build All (workspace)
    runs-on: ubuntu-latest
    needs: [typecheck-all]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build (entire workspace)
        run: pnpm -r --workspace-concurrency 1 build

  tests:
    name: Test ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pkg:
          - { name: basemap-plugin, filter: "@hierarchidb/basemap-plugin" }
          - { name: folder-plugin,  filter: "@hierarchidb/folder-plugin" }
          - { name: resolver-plugin, filter: "@hierarchidb/resolver-plugin" }
          - { name: styler-plugin,   filter: "@hierarchidb/styler-plugin" }
          - { name: shape-plugin (unit only), filter: "@hierarchidb/shape-plugin" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run unit/integration tests
        env:
          # Ensure deep/integration tests stay gated unless explicitly enabled
          ENABLE_SHAPE_DEEP_TESTS: ""
          ENABLE_INTEGRATION_TESTS: ""
          CI: "true"
          VITEST_POOL: "threads"
          VITEST_MAX_THREADS: "2"
          VITEST_MIN_THREADS: "1"
        run: pnpm --filter "${{ matrix.pkg.filter }}" test

  build:
    name: Typecheck/Build ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pkg:
          - { name: basemap-plugin, filter: "@hierarchidb/basemap-plugin" }
          - { name: folder-plugin,  filter: "@hierarchidb/folder-plugin" }
          - { name: resolver-plugin, filter: "@hierarchidb/resolver-plugin" }
          - { name: styler-plugin,   filter: "@hierarchidb/styler-plugin" }
          - { name: shape-plugin (unit only), filter: "@hierarchidb/shape-plugin" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck (with deps)
        run: pnpm -r --filter "${{ matrix.pkg.filter }}^..." typecheck

      - name: Build (with deps)
        run: pnpm -r --filter "${{ matrix.pkg.filter }}^..." build
