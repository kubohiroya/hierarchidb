name: Biome + Deprecations (core)

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: biome-deprecations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome-core:
    if: ${{ false }}
    name: Biome Check (core only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile --force

      - name: Biome check (core packages)
        run: pnpm biome:check:core

  eslint-deprecations:
    if: ${{ false }}
    name: ESLint Deprecations (core only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile --force

      - name: Deprecations check (ESLint)
        run: pnpm eslint:deprecations
