name: Naming Audit

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/naming-audit.yml'
      - 'app/src/**/*.ts'
      - 'app/src/**/*.tsx'
      - 'packages/*/src/**/*.ts'
      - 'packages/*/src/**/*.tsx'
      - 'plugins/*-plugin/src/**/*.ts'
      - 'plugins/*-plugin/src/**/*.tsx'
      - 'scripts/naming-audit-baseline.json'
      - 'scripts/naming-audit/**'
      - 'scripts/naming-audit.ts'

concurrency:
  group: naming-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming-audit:
    name: Naming Convention Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile --filter .

      - name: Run naming audit
        env:
          NAMING_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          echo "### Naming audit" >> "${GITHUB_STEP_SUMMARY}"
          echo "- base: ${NAMING_AUDIT_BASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- baseline: scripts/naming-audit-baseline.json" >> "${GITHUB_STEP_SUMMARY}"
          echo "- scope: current changed files only unless audit implementation changed" >> "${GITHUB_STEP_SUMMARY}"
          pnpm tsx scripts/naming-audit.ts \
            --ci \
            --changed-since "${NAMING_AUDIT_BASE_SHA}" \
            --baseline scripts/naming-audit-baseline.json
