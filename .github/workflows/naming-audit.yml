name: Naming Audit

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base ref used for changed-file scanning'
        required: false
        default: 'main'
      head_ref:
        description: 'Head ref to audit; defaults to the dispatched ref'
        required: false
        default: ''

concurrency:
  group: naming-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming-audit:
    name: Naming Convention Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref || github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile --filter .

      - name: Run naming audit
        env:
          NAMING_AUDIT_BASE_REF: ${{ inputs.base_ref || 'main' }}
        run: |
          set -euo pipefail
          echo "### Naming audit" >> "${GITHUB_STEP_SUMMARY}"
          echo "- base: ${NAMING_AUDIT_BASE_REF}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- baseline: scripts/naming-audit-baseline.json" >> "${GITHUB_STEP_SUMMARY}"
          echo "- scope: manually requested changed-file audit" >> "${GITHUB_STEP_SUMMARY}"
          echo "- baseline verification: handled by the dedicated baseline workflow" >> "${GITHUB_STEP_SUMMARY}"
          pnpm tsx scripts/naming-audit.ts \
            --ci \
            --changed-since "${NAMING_AUDIT_BASE_REF}" \
            --baseline scripts/naming-audit-baseline.json
