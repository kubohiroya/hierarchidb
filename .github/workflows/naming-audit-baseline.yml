name: Naming Audit Baseline

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 18 * * 0'

concurrency:
  group: naming-audit-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Validate naming baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile --filter .

      - name: Validate baseline
        run: |
          set -euo pipefail
          echo "### Naming audit baseline validation" >> "${GITHUB_STEP_SUMMARY}"
          echo "- scope: full scan on the default branch" >> "${GITHUB_STEP_SUMMARY}"
          echo "- baseline: scripts/naming-audit-baseline.json" >> "${GITHUB_STEP_SUMMARY}"
          pnpm tsx scripts/naming-audit.ts \
            --ci \
            --baseline scripts/naming-audit-baseline.json
