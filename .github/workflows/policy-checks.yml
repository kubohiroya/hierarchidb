name: Policy Checks (warn-only)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  policy-checks:
    name: Run policy/dependency checks (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
      
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies (non-strict)
        run: pnpm install --no-frozen-lockfile

      - name: Policy checker (check-deps)
        run: pnpm -w check:deps:pkg || true

      - name: dependency-cruiser (architecture warnings)
        run: pnpm -w arch:dc || true

      - name: syncpack (list mismatches)
        run: pnpm -w deps:list || true

      - name: publint (package publish sanity)
        run: pnpm -w pkg:publint || true

      - name: '@arethetypeswrong/cli (types sanity)'
        run: pnpm -w pkg:attw || true
