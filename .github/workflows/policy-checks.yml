name: Repository Diagnostics (scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: read

jobs:
  policy-checks:
    name: Run non-blocking repository diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7

        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: dependency-cruiser (architecture warnings)
        continue-on-error: true
        run: pnpm -w arch:dc

      - name: syncpack (list mismatches)
        continue-on-error: true
        run: pnpm -w deps:list
