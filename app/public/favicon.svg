<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
    <!-- Hierarchical tree structure icon for HierarchiDB -->

    <!-- Top node (root) -->
    <circle cx="12" cy="4" r="2.5" fill="#1976d2"/>

    <!-- Connection lines from top to middle -->
    <line x1="12" y1="6.5" x2="7.5" y2="9.5" stroke="#1976d2" strokeWidth="1.5"/>
    <line x1="12" y1="6.5" x2="16.5" y2="9.5" stroke="#1976d2" strokeWidth="1.5"/>

    <!-- Middle nodes -->
    <circle cx="7.5" cy="12" r="2.5" fill="#42a5f5"/>
    <circle cx="16.5" cy="12" r="2.5" fill="#42a5f5"/>

    <!-- Connection lines from middle to bottom -->
    <line x1="7.5" y1="14.5" x2="4" y2="17.5" stroke="#42a5f5" strokeWidth="1.5"/>
    <line x1="7.5" y1="14.5" x2="9.5" y2="17.5" stroke="#42a5f5" strokeWidth="1.5"/>
    <line x1="16.5" y1="14.5" x2="14.5" y2="17.5" stroke="#42a5f5" strokeWidth="1.5"/>
    <line x1="16.5" y1="14.5" x2="20" y2="17.5" stroke="#42a5f5" strokeWidth="1.5"/>

    <!-- Bottom nodes (leaf nodes) -->
    <circle cx="4" cy="20" r="2" fill="#90caf9"/>
    <circle cx="9.5" cy="20" r="2" fill="#90caf9"/>
    <circle cx="14.5" cy="20" r="2" fill="#90caf9"/>
    <circle cx="20" cy="20" r="2" fill="#90caf9"/>
</svg>