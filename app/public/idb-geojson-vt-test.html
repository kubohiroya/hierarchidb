<!doctype html>
<meta charset="utf-8" />
<title>geojson-vt IndexedDB prototype restore test</title>

<body>
<h1>geojson-vt IndexedDB prototype restore test</h1>
<p>Open DevTools Console.</p>

<script type="module">
  // CDN: ここは環境により差し替えてOK（skypack/jsdelivr/unpkg など）
  import geojsonvt from "https://cdn.skypack.dev/geojson-vt";

  // --- 1) テスト用のGeoJSON（LineStringを入れる：lineMetrics絡みを踏みやすい） ---
  const gj = {
    type: "FeatureCollection",
    features: [
      {
        type: "Feature",
        properties: { name: "line1" },
        geometry: {
          type: "LineString",
          coordinates: [
            [139.70, 35.68],
            [139.71, 35.681],
            [139.72, 35.682],
            [139.73, 35.683],
          ],
        },
      },
    ],
  };

  // オプションは必要最小限。lineMetricsをtrueにすると、内部の追加プロパティ依存が増える可能性がある
  const options = {
    maxZoom: 6,
    indexMaxZoom: 6, // 生成済みタイルだけを使う想定なら maxZoom と揃えると検証が安定
    tolerance: 3,
    extent: 4096,
    buffer: 64,
    lineMetrics: true,
  };

  const original = geojsonvt(gj, options);
  const proto = Object.getPrototypeOf(original);

  // 何かタイルを一度作っておく（保存前にtilesへ入っている状態にする）
  const tile0 = original.getTile(0, 0, 0);
  console.log("original.getTile(0,0,0) OK?", !!tile0);

  // --- 2) IndexedDBへ保存/復元 ---
  const DB_NAME = "geojson-vt-test-db";
  const STORE = "kv";
  const KEY = "index";

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function idbPut(db, key, value) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function idbGet(db, key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // 追加プロパティが structured clone で残るかの“ミニ検証”
  async function checkArrayExtraProps(db) {
    const arr = [1, 2, 3];
    arr.foo = 123;
    await idbPut(db, "arr", arr);
    const restoredArr = await idbGet(db, "arr");
    console.log("Array extra prop preserved? restoredArr.foo =", restoredArr?.foo);
  }

  const db = await openDB();
  await checkArrayExtraProps(db);

  await idbPut(db, KEY, original);
  const restoredRaw = await idbGet(db, KEY);

  console.log("restoredRaw has getTile?", typeof restoredRaw?.getTile); // たぶん "undefined"

  // --- 3) prototype を戻す ---
  Object.setPrototypeOf(restoredRaw, proto);
  console.log("after setPrototypeOf, has getTile?", typeof restoredRaw?.getTile); // "function" になるはず

  // --- 4) getTile が動くか ---
  let restoredTile;
  try {
    restoredTile = restoredRaw.getTile(0, 0, 0);
    console.log("restored.getTile(0,0,0) OK?", !!restoredTile);
  } catch (e) {
    console.error("restored.getTile threw:", e);
  }

  // --- 5) 代表的な“壊れポイント”を追加チェック ---
  // a) tiles が残っているか
  console.log("restored tiles keys:", restoredRaw.tiles ? Object.keys(restoredRaw.tiles).slice(0, 5) : null);

  // b) lineMetrics絡み: geometry配列に size/start/end 的な追加プロパティが残っているか
  //    ※内部構造はタイル内容次第で変わるので、存在したら表示する程度
  function findGeomWithSize(tile) {
    if (!tile?.features) return null;
    for (const f of tile.features) {
      // f.geometry は GeoJSON-VT の内部表現で、配列の配列だったりする
      const g = f.geometry;
      if (Array.isArray(g)) {
        for (const part of g) {
          // part が配列で、part.size があるかどうか
          if (Array.isArray(part) && ("size" in part || "start" in part || "end" in part)) {
            return { size: part.size, start: part.start, end: part.end };
          }
        }
      }
    }
    return null;
  }

  console.log("original geom extra props:", findGeomWithSize(tile0));
  console.log("restored geom extra props:", findGeomWithSize(restoredTile));

  // --- 6) 参考: JSON化すると壊れるか（geomの追加プロパティが落ちるはず） ---
  const json = JSON.stringify(original);
  const revived = JSON.parse(json);
  console.log("JSON revived has getTile?", typeof revived?.getTile); // undefined
  // 配列の追加プロパティは JSON では落ちるので、上の findGeomWithSize 的な情報は基本消える


  function lon2tile(lon, z) {
    return Math.floor(((lon + 180) / 360) * (1 << z));
  }
  function lat2tile(lat, z) {
    const rad = (lat * Math.PI) / 180;
    const n = Math.tan(rad) + 1 / Math.cos(rad);
    return Math.floor(((1 - Math.log(n) / Math.PI) / 2) * (1 << z));
  }

  const z = 6;
  const lon = 139.70;
  const lat = 35.68;

  const x = lon2tile(lon, z);
  const y = lat2tile(lat, z);

  console.log("computed tile", { z, x, y });

  const drill = restoredRaw.getTile(z, x, y);
  console.log("drill-down works (computed)?", !!drill, drill);

  console.log("DONE");
</script>
</body>
