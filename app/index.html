  <script type="text/javascript">
    // GitHub Pages SPAリダイレクト処理
    // 404.htmlからのリダイレクトを処理
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash,
        );
      }
    }(window.location));
  </script>

<body>
<div
  id="hdb-hydrate-fallback"
  style="
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    z-index: 9999;
  "
>
  <div style="width: 60%; max-width: 420px;">
    <div style="height: 6px; background: #e0e0e0; border-radius: 999px; overflow: hidden;">
      <div
        style="
          width: 40%;
          height: 100%;
          background: #1976d2;
          animation: hdb-load 1.2s ease-in-out infinite;
        "
      ></div>
    </div>
    <div
      style="
        margin-top: 12px;
        text-align: center;
        color: #6b7280;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.02em;
      "
    >
      Loading...
    </div>
  </div>
  <style>
    @keyframes hdb-load {
      0% { transform: translateX(-20%); width: 20%; }
      50% { transform: translateX(60%); width: 40%; }
      100% { transform: translateX(120%); width: 20%; }
    }
  </style>
</div>
<div id="root"></div>
<noscript>JavaScript is required to run this application.</noscript>
</body>
